t2i_pretrain:
  dataset_names:
  - t2i
  image_transform_args:
    image_stride: 16
    max_image_size: 256
    min_image_size: 256
  is_mandatory: true
  num_used_data:
  - 2
  weight: 1

unified_edit:
  dataset_names:
  - seedxedit_multi
  image_transform_args:
    image_stride: 16
    max_image_size: 256
    min_image_size: 256
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 224
    min_image_size: 224
  is_mandatory: true
  num_used_data:
  - 2
  weight: 1

vlm_sft:
  dataset_names:
  - llava_ov
  image_transform_args:
    image_stride: 14
    max_image_size: 224
    min_image_size: 224
    max_pixels: 50176
  frame_sampler_args:
    max_num_frames: 2
    min_num_frames: 1
  is_mandatory: true
  shuffle_lines: false
  num_used_data:
  - 8
  weight: 1
